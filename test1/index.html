<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Todo List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f3f4f6;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header, main, footer {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    #todo-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 0;
      list-style: none;
    }

    .todo-card {
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .status {
      margin-right: 8px;
    }

    .error {
      color: #b00020;
    }

    @media (min-width: 768px) {
      #todo-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>My Todo List</h1>
    <p id="count" aria-live="polite">Loading…</p>
  </header>

  <main>
    <p id="message" role="status" aria-live="polite">Loading…</p>
    <ul id="todo-list"></ul>
  </main>

  <footer>
    <p>Todo list</p>
  </footer>

  <script>
    const countElement = document.querySelector("#count");
    const messageElement = document.querySelector("#message");
    const todoList = document.querySelector("#todo-list");

    async function loadTodos() {
      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/todos?_limit=12"
        );

        if (!response.ok) {
          throw new Error("The request failed");
        }

        const todos = await response.json();
        const completed = todos.filter(todo => todo.completed).length;

        countElement.textContent =
          `${completed} of ${todos.length} completed`;

        for (const todo of todos) {
          const card = document.createElement("li");
          card.className = "todo-card";

          const status = document.createElement("span");
          status.className = "status";
          status.textContent = todo.completed ? "✅" : "⬜";

          const title = document.createElement("span");
          title.textContent = todo.title;

          card.append(status, title);
          todoList.append(card);
        }

        messageElement.textContent = "";
      } catch (error) {
        countElement.textContent = "Todo count unavailable";
        messageElement.textContent =
          "Sorry, we couldn't load the todos. Please check your internet connection and try again.";
        messageElement.classList.add("error");
      }
    }

    loadTodos();
  </script>
</body>
</html>
